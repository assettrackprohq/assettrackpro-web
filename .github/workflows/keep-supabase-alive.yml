name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'   # Runs every 3 days at 8:00 AM UTC
  workflow_dispatch:          # Lets you trigger it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://olcteqqdiycrwiveytbp.supabase.co/rest/v1/companies?select=id&limit=1")
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Warning: Unexpected response $RESPONSE"
            exit 1
          fi
          echo "Supabase is alive!"
