async function delF(id){const x=S.fd.find(f=>f.id==id);if(!x||!confirm('Delete the field "'+x.label+'"? Values already entered by counters are kept.'))return;const r=await sb.from('count_field_defs').delete().eq('id',id);if(r.error)return msg(r.error.message);await go('fields');msg('Field deleted.')}
async function copyF(){const from=$('#cf').value,r=await sb.from('count_field_defs').select('key,label,data_type,applies_to_categories,sort').eq('engagement_id',from);if(r.error)return msg(r.error.message);const have=new Set(S.fd.map(x=>x.key)),rows=(r.data||[]).filter(x=>!have.has(x.key)).map(x=>({...x,organization_id:S.org,engagement_id:S.eng}));if(!rows.length)return msg('Nothing to copy: this engagement already has those fields.');const i=await sb.from('count_field_defs').insert(rows);if(i.error)return msg(i.error.message);await go('fields');msg(rows.length+' field(s) copied.')}
async function saveCo(){const n=$('#cn2').value.trim();if(!n)return msg('Enter a name.');const r=await sb.from('organizations').update({name:n}).eq('id',S.org).select();if(r.error)return msg(r.error.message);if(!(r.data||[]).length)return msg('Not saved: only an administrator can change the company name.');const o=S.orgs.find(x=>x.id==S.org);if(o)o.name=n;draw();msg('Company name saved. Counters see it the next time they refresh.')}
async function wipeE(keep,del){const E0=E();if(!E0)return;const w=del?'DELETE':'CLEAR';if(!typed(w,(del?'Delete the engagement "'+E0.name+'" and everything in it.':'Clear the counts in "'+E0.name+'"'+(keep?' (the item list and system quantities stay).':' and its system quantities.'))))return;const r=await sb.rpc('count_wipe_engagement',{p_engagement:S.eng,p_keep_baseline:keep,p_delete:del});if(r.error)return msg(r.error.message);await loadEngs();draw();msg(del?'Engagement deleted.':'Counts cleared.')}
async function resetAll(){if(!typed('DELETE ALL','Delete EVERY engagement and all count data in this organisation. Items, locations and people stay.'))return;const r=await sb.rpc('count_reset_all',{p_org:S.org});if(r.error)return msg(r.error.message);await loadEngs();draw();msg(r.data.engagements+' engagement(s) deleted.')}
async function bulkM(kind){const nm={items:'ALL items',locations:'ALL locations',both:'ALL items and locations'}[kind];if(!typed('DELETE','Delete '+nm+' in this organisation. This only works when no count data exists.'))return;const r=await sb.rpc('count_delete_master',{p_org:S.org,p_kind:kind});if(r.error)return msg(r.error.message);msg('Deleted '+r.data.items+' item(s) and '+r.data.locations+' location(s).');go('data')}
const cl=q=>q.replace(/[,()%*\\]/g,' ').trim();
async function findLoc(){const q=cl(($('#ql')||{}).value||'');let r=sb.from('locations').select('id,code,name').eq('organization_id',S.org).order('code').limit(40);if(q)r=r.or('code.ilike.%'+q+'%,name.ilike.%'+q+'%');const d=(await r).data||[];S.ll=d;const e=$('#ll');if(e)e.innerHTML=tbl([['code','Code'],['name','Name'],['act','']],d.map(x=>({...x,act:`<button class=dn onclick="delLoc('${x.id}')">Delete</button>`})))}
async function findItem(){const q=cl(($('#qi')||{}).value||'');let r=sb.from('inventory_items').select('id,item_code,name').eq('organization_id',S.org).order('item_code').limit(40);if(q)r=r.or('item_code.ilike.%'+q+'%,name.ilike.%'+q+'%');const d=(await r).data||[];S.il=d;const e=$('#il');if(e)e.innerHTML=tbl([['item_code','SKU'],['name','Description'],['act','']],d.map(x=>({...x,act:`<button class=dn onclick="delItem('${x.id}')">Delete</button>`})))}
async function delData(fn,key,id,label,after){if(!confirm('Delete '+label+'?'))return;let r=await sb.rpc(fn,{[key]:id,p_force:false});
 if(r.error&&/IN_USE:/.test(r.error.message)){const d=r.error.message.replace(/^.*IN_USE:\s*/,'');if(!confirm(label+' is used by: '+d+'.\n\nDelete anyway? Those counts and records are deleted with it.'))return;r=await sb.rpc(fn,{[key]:id,p_force:true})}
 if(r.error)return msg(r.error.message);msg(label+' deleted.');after()}
const delLoc=id=>delData('count_delete_location','p_location',id,'location '+((S.ll.find(x=>x.id==id)||{}).code||''),findLoc),delItem=id=>delData('count_delete_item','p_item',id,'item '+((S.il.find(x=>x.id==id)||{}).item_code||''),findItem);
function cov(){const sc=$('#cs')?$('#cs').value:'all',fl=$('#cf2')?$('#cf2').value:'all',L=S.locs.filter(l=>sc=='all'||!S.bs||S.bs.has(l.id)).sort((a,b)=>nat(a.code,b.code)),R=[1,2,3],by={};
 S.asg.forEach(a=>{const k=a.location_id+'|'+a.round;(by[k]=by[k]||[]).push(a)});const nm=id=>(S.team.find(m=>m.id==id)||{}).name||'?';
 $('#cvs').innerHTML=R.map(r=>{const n=L.filter(l=>by[l.id+'|'+r]).length;return `<span class=chip>Round ${r}: <b>${n}</b> of ${L.length} assigned · <b>${L.length-n}</b> not assigned</span>`}).join(' ');
 const rows=L.filter(l=>fl=='all'||!by[l.id+'|'+fl]);
 $('#cvt').innerHTML=tbl([['n','No.'],['code','Location'],['c1','Round 1'],['c2','Round 2'],['c3','Round 3']],rows.slice(0,400).map((l,i)=>{const o={n:i+1,code:l.code};R.forEach(r=>{const a=by[l.id+'|'+r];o['c'+r]=a?a.map(x=>h(nm(x.assigned_to))+' <span class=mu>('+h(String(x.status).replace('_',' '))+')</span>').join(', '):'<span class=na>Not assigned</span>'});return o}))+(rows.length>400?'<p class=mu>Showing the first 400.</p>':'')+(rows.length?'':'<p class=mu>Nothing to show.</p>')}
function tickLoc(v){document.querySelectorAll('.lc').forEach(x=>x.checked=!!v)}
async function tickBase(){try{const b=await all(()=>sb.from('count_baseline').select('location_id').eq('engagement_id',S.eng).order('id')),k=new Set(b.map(x=>x.location_id));document.querySelectorAll('.lc').forEach(x=>x.checked=k.has(x.value));if(!k.size)msg('This engagement has no imported location list.')}catch(e){msg(e.message||String(e))}}
async function mkAsg(){const w=[...document.querySelectorAll('.cn:checked')].map(x=>x.value);if(!w.length)return msg('Tick at least one counter.');
 const rd=+$('#rd').value,have=new Set((S.asg||[]).filter(a=>a.round==rd).map(a=>a.location_id)),T=[...document.querySelectorAll('.lc:checked')].map(x=>x.value);
 if(!T.length)return msg('Tick at least one location.');const L=T.filter(l=>!have.has(l)),skip=T.length-L.length;
 if(!L.length)return msg('All ticked locations already have a counter in this round.');
 const bl=Math.ceil(L.length/w.length),rows=L.map((l,i)=>({organization_id:S.org,engagement_id:S.eng,location_id:l,round:rd,assigned_to:$('#sm').value=='turn'?w[i%w.length]:w[Math.floor(i/bl)]}));
 for(const c of chunk(rows,500)){const r=await sb.from('count_assignments').upsert(c,{onConflict:'engagement_id,location_id,round,assigned_to',ignoreDuplicates:true});if(r.error)return msg(r.error.message)}
 await go('asg');msg(rows.length+' assignments created'+(skip?' ('+skip+' skipped: already assigned in this round)':'')+'.')}
async function sign(id){const r=await sb.rpc('signoff_count_assignment',{p_assignment:id});if(r.error)return msg(r.error.message);go('asg')}
async function lines(){const r=await all(()=>sb.rpc('count_lines',{p_engagement:S.eng}).order('sku'));S.lines=r}
async function appCase(i,l){const e=$('#q'+i.slice(0,6)+l.slice(0,6)),q=+(e?e.value:NaN);if(!e||e.value===''||isNaN(q)||q<0)return popup('Check the quantity','<p>Enter a quantity of zero or more.</p>');
 const r=await sb.rpc('approve_case',{p_engagement:S.eng,p_item:i,p_location:l,p_final_qty:q,p_note:null});if(r.error)return popup('Not approved','<p class=bad>'+h(r.error.message)+'</p>');
 const x=S.lines.find(z=>z.item_id==i&&z.location_id==l)||{};await popup('Approved','<p class=big>✔</p><p><b>'+h(x.sku)+'</b> at <b>'+h(x.location)+'</b> approved at <b>'+q+'</b>'+(x.system_qty!=null?' (system '+x.system_qty+', difference '+(q-x.system_qty)+')':'')+'.</p>');go('rec')}
async function appSel(){const ck=[...document.querySelectorAll('.ck:checked')];if(!ck.length)return popup('Nothing selected','<p>Tick the lines you want to approve first.</p>');
 const lines=ck.map(c=>({item_id:c.dataset.i,location_id:c.dataset.l,final_qty:$('#'+c.dataset.q).value===''?NaN:+$('#'+c.dataset.q).value}));
 if(lines.some(l=>isNaN(l.final_qty)||l.final_qty<0))return popup('Check the quantities','<p>Every ticked line needs a quantity of zero or more.</p>');
 if(!confirm('Approve '+lines.length+' line(s) at the quantities shown?'))return;
 const r=await sb.rpc('count_approve_many',{p_engagement:S.eng,p_lines:lines});if(r.error)return popup('Not approved','<p class=bad>'+h(r.error.message)+'</p>');
 const d=r.data||{},f=d.failed||[],nm=x=>{const z=S.lines.find(l=>l.item_id==x.item_id&&l.location_id==x.location_id)||{};return h(z.sku)+' at '+h(z.location)};
 await popup(f.length?'Approved, with problems':'Approved','<p class=big>'+(f.length?'⚠':'✔')+'</p><p><b>'+d.approved+'</b> of '+lines.length+' line(s) approved.</p>'+(f.length?'<p class=bad>Not approved:</p><ul>'+f.map(x=>'<li>'+nm(x)+': '+h(x.error)+'</li>').join('')+'</ul>':''));go('rec')}
async function appr(id){const r=await sb.rpc('approve_proposed_item',{p_proposed:id});if(r.error)return msg(r.error.message);go('rec')}
async function exp(k,fmt){try{await lines();const L=S.lines,VC=[['sku','SKU'],['oem_part_no','OEM part no.'],['description','Description'],['location','Location'],['system_qty','System qty'],['r1','Count 1'],['r2','Recount'],['r3','Round 3'],['final_qty','Final count'],['variance','Variance'],['status','Status']];
 if(k=='final')return dl('final_count',VC,L,fmt);if(k=='var')return dl('variance',VC,L.filter(l=>l.status!='Matched'),fmt);
 if(k=='kpi'){const m=L.filter(l=>l.system_qty!=null&&l.final_qty!=null),ok=m.filter(l=>l.variance==0).length,c=await all(()=>sb.from('count_cases').select('status').eq('engagement_id',S.eng).order('id'));
  return dl('kpi',[['m','Metric'],['v','Value']],[{m:'Lines counted',v:L.filter(l=>l.final_qty!=null).length},{m:'Lines compared with list',v:m.length},{m:'Count accuracy %',v:m.length?Math.round(ok/m.length*1000)/10:''},{m:'Cases open (variance lines)',v:L.filter(l=>l.status=='Variance'||l.status=='Needs recount').length},{m:'Cases approved',v:c.filter(x=>x.status=='closed').length}],fmt)}
 const en=await all(()=>sb.from('count_entries').select('item_id,location_id,round,counted_qty,condition,flag,expiry_date,remarks,counted_at').eq('engagement_id',S.eng).or('condition.neq.Good,flag.neq.None,expiry_date.not.is.null').order('counted_at')),
 im={};for(const c of chunk([...new Set(en.map(x=>x.item_id).filter(Boolean))],150))(await sb.from('inventory_items').select('id,item_code,name').in('id',c)).data.forEach(x=>im[x.id]=x);
 const lm=Object.fromEntries((await sb.from('locations').select('id,code').eq('organization_id',S.org)).data.map(x=>[x.id,x.code]));
 dl('exceptions',[['sku','SKU'],['d','Description'],['loc','Location'],['counted_qty','Qty'],['condition','Condition'],['flag','Flag'],['expiry_date','Expiry'],['remarks','Remarks']],en.map(x=>({...x,sku:(im[x.item_id]||{}).item_code,d:(im[x.item_id]||{}).name,loc:lm[x.location_id]})),fmt)}catch(e){msg(e.message||String(e))}}
boot();
</script></body></html>
